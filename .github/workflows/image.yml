name: Build & Push image

# 백엔드 Docker 이미지 빌드 → GHCR 푸시 (프론트와 동일한 A-2 방식)
#  - PR            : 빌드만 (Dockerfile 검증), 푸시 X
#  - main push/수동 : 빌드 + GHCR 푸시. 실제 배포 반영은 bambi-build 의 Deploy 에서 pull
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io/hk-toss-final-project/<repo> (소문자 자동)
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GHCR 푸시는 GITHUB_TOKEN 으로 (별도 PAT 불필요)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # PR 이 아닐 때만 로그인(푸시용). PR 은 빌드 검증만.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .          # Dockerfile: gradle bootJar → temurin JRE 실행 (build-args 없음)
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
