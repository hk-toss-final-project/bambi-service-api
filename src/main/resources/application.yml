server:
  port: 8080

spring:
  datasource:
    # docker-compose 가 주입(DB_*). 로컬 단독 실행 시 localhost 기본값.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bambi}
    username: ${DB_USER:bambi}
    password: ${DB_PASSWORD:bambi}
  jpa:
    hibernate:
      # 배포 규약: 스키마는 Flyway 가 소유. JPA 는 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        # 모든 엔티티는 service 스키마에 매핑 (agent 스키마는 agent-api 소유)
        default_schema: service
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    # V1__init.sql 이 service/agent 스키마를 CREATE 한다. history 테이블은 service 에.
    schemas: service
    default-schema: service
    # 번호 예약 병렬 작업(V6=소라·V7=영현·V8=우석, 07-31) — 머지 순서가 번호 순서와
    # 다를 수 있어, 큰 번호가 먼저 배포돼도 늦게 온 작은 번호를 적용하게 허용한다.
    out-of-order: true

app:
  # docker-compose 가 주입하는 환경변수 (없으면 기본값)
  version: ${APP_VERSION:0.0.1}
  color: ${APP_COLOR:blue}
  development:
    # 개발 서버의 수동 리포트 생성 패널. 현재 개발 배포에서는 기본 노출하고 운영은 false로 끈다.
    report-triggers-enabled: ${DEV_REPORT_TRIGGER_ENABLED:true}
  jwt:
    # 운영 환경에선 반드시 JWT_SECRET 주입 (HS256 → 최소 32바이트)
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  oauth:
    # 외부 MCP client가 discovery에서 보는 공개 Authorization Server origin.
    issuer-url: ${OAUTH_ISSUER_URL:http://localhost}
    # 기존 서비스 로그인을 재사용하는 Next.js 승인 화면.
    authorization-page-url: ${OAUTH_AUTHORIZATION_PAGE_URL:http://localhost/oauth/authorize}
    # RFC 8707 resource indicator. 공개 MCP URL과 정확히 같아야 한다.
    resource-url: ${MCP_SERVER_URL:http://localhost/mcp}
    authorization-request-minutes: ${OAUTH_AUTHORIZATION_REQUEST_MINUTES:10}
    authorization-code-minutes: ${OAUTH_AUTHORIZATION_CODE_MINUTES:5}
    access-token-minutes: ${OAUTH_ACCESS_TOKEN_MINUTES:60}
    refresh-token-days: ${OAUTH_REFRESH_TOKEN_DAYS:30}
  admin:
    # 서버 시작 시 두 값이 모두 있으면 ADMIN 계정을 seed 한다 (없으면 skip)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  agent:
    # agent-api(FastAPI) 내부 호출 주소.
    base-url: ${AGENT_API_BASE:http://localhost:8000}
    # 내부 API Bearer 토큰 (2026-07-30 도입). 비우면 헤더 미부착 = 무인증 로컬 agent 호환.
    internal-token: ${AGENT_INTERNAL_TOKEN:}
    # 내부 API prefix (agent 계약: /internal/v1)
    internal-prefix: ${AGENT_API_PREFIX:/internal/v1}
    # 컨텍스트 동기화는 202 폴링이 아니라 가벼운 동기 호출(200) → 짧게.
    connect-timeout-ms: ${AGENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AGENT_READ_TIMEOUT_MS:3000}
    # 아침 브리핑 주제 선정(GET /users/{id}/briefing-topics)은 agent 안에서 LLM 이 돈다 —
    # 위 3초로는 매번 타임아웃이라 전원이 등록 관심사 폴백으로 떨어진다("전환했는데 안 바뀜").
    # 근거: 유림님 08-10 벤치 평균 2.2초·최대 5.07초, 12케이스 중 3개가 3초 초과.
    #       실서비스는 후보가 더 많고 agent 부하도 있어 관측 최대의 3배로 잡았다(우석 08-11).
    # ⚠️ 스케줄러가 사용자를 순차로 돌며 1인 1회 부르므로 최악은 사용자 수 × 이 값이다
    #    (27명 기준 약 7분 — 07:00 창 안). 사용자가 늘면 이 값을 키우지 말고 스케줄러 루프를
    #    병렬로 바꿔야 한다.
    selection-read-timeout-ms: ${AGENT_SELECTION_READ_TIMEOUT_MS:15000}
    publish:
      # 발행 claim/ack 클라이언트 구현 선택: mock(인프로세스 큐, P0) | http(실제 agent-api 호출, P1)
      # 미설정 시 mock — 로컬/데모는 mock, agent-api 붙일 땐 http.
      mode: ${AGENT_PUBLISH_MODE:mock}
    generation:
      # 생성 요청 클라이언트 구현 선택: mock(로그만) | http(실제 agent-api POST /generations 호출)
      # 미설정 시 mock. 스케줄러 자체 on/off 는 app.scheduler.generation.enabled 와 별개.
      mode: ${AGENT_GENERATION_MODE:mock}
    # 저장 시 동기 Mock 즉시 카드 (P0 관통용 데모 안전판 — 제품 모델은 저장≠생성, 루트 CLAUDE.md).
    # 비동기 발행 경로(claim→report+card)가 검증된 환경에서는 false 로 꺼서 Mock 카드가 실 카드와 섞이지 않게 한다.
    immediate-card:
      enabled: ${AGENT_IMMEDIATE_CARD_ENABLED:true}
  worker:
    scrap-wiki:
      enabled: ${WORKER_SCRAP_WIKI_ENABLED:true}
      poll-interval-ms: ${WORKER_SCRAP_WIKI_POLL_INTERVAL_MS:3000}
      initial-delay-ms: ${WORKER_SCRAP_WIKI_INITIAL_DELAY_MS:5000}
      batch-limit: ${WORKER_SCRAP_WIKI_BATCH_LIMIT:20}
    job-status:
      enabled: ${WORKER_JOB_STATUS_ENABLED:true}
      poll-interval-ms: ${WORKER_JOB_STATUS_POLL_INTERVAL_MS:5000}
      initial-delay-ms: ${WORKER_JOB_STATUS_INITIAL_DELAY_MS:5000}
      batch-limit: ${WORKER_JOB_STATUS_BATCH_LIMIT:100}
    # service-worker 발행 폴링 루프 (docs/service-integration-guide.md §4)
    publish:
      enabled: ${WORKER_PUBLISH_ENABLED:true}        # false 면 워커 빈 비활성
      worker-id: ${WORKER_ID:service-worker-01}
      poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:15000}   # 10~30초 권장
      initial-delay-ms: ${WORKER_INITIAL_DELAY_MS:10000}
      batch-limit: ${WORKER_BATCH_LIMIT:50}
      lease-seconds: ${WORKER_LEASE_SECONDS:120}
  scheduler:
    # 콘텐츠 생성 트리거 (송우 가이드 §3.4 — 지정 시각에 사용자별 생성 요청)
    generation:
      # 기본 비활성(실제 생성 연동 P1 전까지 Mock 로깅). 켜려면 true.
      enabled: ${SCHEDULER_GENERATION_ENABLED:false}
      cron: ${SCHEDULER_GENERATION_CRON:0 0 7 * * *}   # 매일 07:00 KST
      content-type: ${SCHEDULER_GENERATION_CONTENT_TYPE:interest_news_card}
    # 아침 브리핑 주제 선조회 (2026-08-11 유림 요청 — 새벽에 주제를 알려주면 agent 가 미리 수집한다).
    # 07:00 생성보다 앞서야 의미가 있다. generation 스케줄러와 독립적으로 켜고 끈다.
    briefing-prefetch:
      enabled: ${SCHEDULER_BRIEFING_PREFETCH_ENABLED:false}
      cron: ${SCHEDULER_BRIEFING_PREFETCH_CRON:0 0 3 * * *}   # 매일 03:00 KST
      # topic(검색 주제)은 고정값이 아니라 사용자별 대표 관심사(위키 태그 score 최고)를 런타임에 사용한다.
